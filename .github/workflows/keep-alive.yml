# Render (plan Free) apaga el servicio tras 15 minutos sin tráfico y la
# siguiente petición tarda ~90 s en despertarlo. Este workflow llama a
# /health cada 10 minutos para que la app nunca encuentre el API dormido.
#
# - GitHub solo ejecuta los workflows programados desde la rama por defecto (main).
# - Los cron de GitHub pueden retrasarse unos minutos en horas de mucha carga.
# - GitHub los desactiva si el repo pasa 60 días sin commits: se reactivan en
#   Actions → Keep Render awake → Enable workflow.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --max-time 150 --retry 2 --retry-delay 10 \
            --output /dev/null \
            --write-out "HTTP %{http_code} en %{time_total}s\n" \
            https://kusitrip-api-rest.onrender.com/health
