# Render (plan Free) apaga el servicio tras 15 minutos sin tráfico y la
# siguiente petición tarda ~90 s en despertarlo.
#
# Es el RESPALDO: el keep-alive principal vive dentro de la app
# (src/health/keep-alive.service.ts), que se llama a sí misma cada 10 min.
# Este workflow solo hace falta para despertarla si algo la apagó. En la
# práctica GitHub lo ejecuta cada pocas horas, no cada 10 min.
#
# (Antes el principal era cron-job.org, pero Render responde 429 a sus IPs
# compartidas y cron-job.org terminó desactivando el cronjob.)
#
# - GitHub solo ejecuta los workflows programados desde la rama por defecto (main).
# - Los cron de GitHub pueden retrasarse o saltarse en horas de mucha carga,
#   sobre todo en minutos "redondos" (:00, :10…). Por eso corre en :03, :13, :23…
# - GitHub los desactiva si el repo pasa 60 días sin commits: se reactivan en
#   Actions → Keep Render awake → Enable workflow.
name: Keep Render awake

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
            --max-time 150 --retry 2 --retry-delay 10 \
            --output /dev/null \
            --write-out "HTTP %{http_code} en %{time_total}s\n" \
            https://kusitrip-api-rest.onrender.com/health
