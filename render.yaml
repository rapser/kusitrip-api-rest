# Render Blueprint (opcional): Dashboard → New → Blueprint → selecciona este repo.
# Los valores marcados con sync: false se piden en el dashboard al crear el servicio.
services:
  - type: web
    name: kusitrip-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
